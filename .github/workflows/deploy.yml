name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish ProfileWeb.csproj -c Release -o release --nologo

      # This repo is a *user* site (novrianfh.github.io) served from "/",
      # so the default <base href="/"> is already correct — no rewrite needed.

      # Static HTML for /pages/{slug}, so a direct request gets a real 200
      # from GitHub Pages instead of relying on the SPA 404-fallback trick
      # (which serves the right content but always with a 404 status).
      - name: Prerender static pages
        run: >
          dotnet run --project tools/PrerenderPages -c Release --
          wwwroot/content/pages release/wwwroot

      - name: GitHub Pages touch-ups
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
