    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ProfileWeb.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <!-- Set theme before first paint to avoid a flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot__box">
                <span class="boot__label">LOADING</span>
                <div class="boot__bar"><span></span></div>
                <span class="boot__hint">compiling webassembly…</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        SOMETHING BROKE.
        <a href="." class="reload">RELOAD</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
